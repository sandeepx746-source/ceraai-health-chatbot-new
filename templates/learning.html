<script>
window.addEventListener("load", () => {
    document.querySelector(".learning-dashboard")?.classList.add("page-ready");
});

let currentLessonData = {};

function safeText(text){
    return text || "Information not available.";
}

function cleanTextForAttr(text){
    return String(text || "Information not available.")
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'")
        .replace(/"/g, "&quot;")
        .replace(/\n/g, " ");
}

function escapeHtml(text){
    const div = document.createElement("div");
    div.innerText = text || "";
    return div.innerHTML;
}

function isGoodMedicalVideo(title){
    const t = String(title || "").toLowerCase();

    const blocked = [
        "kids", "kid", "children", "baby", "mom", "hack",
        "shorts", "#shorts", "tiktok", "reel", "vlog"
    ];

    const preferred = [
        "animation", "animated", "3d", "anatomy",
        "medical", "patient education", "explained",
        "osmosis", "nucleus", "pathophysiology"
    ];

    if(blocked.some(word => t.includes(word))){
        return false;
    }

    return preferred.some(word => t.includes(word));
}

function playVideo(videoId){
    const player = document.getElementById("videoPlayerBox");

    player.innerHTML = `
        <div class="video-screen">
            <iframe
                src="https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0"
                title="CeraAI Learning Video"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen>
            </iframe>
        </div>
    `;
}

function showModule(btn, title, text, icon){
    document.querySelectorAll(".module-item").forEach(item => {
        item.classList.remove("active");
    });

    btn.classList.add("active");

    document.getElementById("detailIcon").innerText = icon;
    document.getElementById("detailTitle").innerText = title;
    document.getElementById("detailText").innerText = text || "Information not available.";
}

function speakLesson(){
    const text = document.getElementById("storyText")?.innerText || "";
    if(!text) return;

    window.speechSynthesis.cancel();

    const speech = new SpeechSynthesisUtterance(text);
    speech.rate = 0.92;
    speech.pitch = 1;
    speech.lang = "en-IN";

    window.speechSynthesis.speak(speech);
}

async function startLearning(){
    const disease = document.getElementById("diseaseInput").value.trim();
    const stage = document.getElementById("visualStage");

    if(!disease){
        alert("Enter disease name");
        return;
    }

    stage.innerHTML = `<div class="loading-box">🧠 Building professional learning dashboard...</div>`;
    stage.classList.add("show");
    stage.scrollIntoView({behavior:"smooth"});

    try{
        const learnResponse = await fetch("/api/learn-disease", {
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({ disease:disease })
        });

        const learnResult = await learnResponse.json();

        if(!learnResult.success){
            stage.innerHTML = `<div class="loading-box">❌ ${learnResult.error}</div>`;
            return;
        }

        const data = learnResult.data;
        currentLessonData = data;

        let videoHtml = `
            <div class="video-screen">
                <div class="video-error">🎥 Searching professional medical animation...</div>
            </div>
        `;

        try{
            const videoResponse = await fetch("/api/learning-video", {
                method:"POST",
                headers:{"Content-Type":"application/json"},
                body:JSON.stringify({
                    disease: `${data.disease || disease} medical animation 3D anatomy pathophysiology`
                })
            });

            const videoData = await videoResponse.json();

            if(videoData.success){
                const videoLabel = isGoodMedicalVideo(videoData.title)
                    ? "Professional Medical Animation"
                    : "Medical Learning Video";

                videoHtml = `
                    <div id="videoPlayerBox">
                        <div class="video-screen">
                            <div class="video-thumb" onclick="playVideo('${videoData.video_id}')">
                                <img src="${videoData.thumbnail}" alt="Learning Video Thumbnail">
                                <div class="video-gradient"></div>
                                <div class="play-btn">▶</div>
                                <div class="video-info">
                                    <span>${videoLabel}</span>
                                    <h3>${escapeHtml(videoData.title)}</h3>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }else{
                videoHtml = `
                    <div class="video-screen">
                        <div class="video-error">⚠️ ${safeText(videoData.error)}</div>
                    </div>
                `;
            }
        }catch(videoError){
            videoHtml = `
                <div class="video-screen">
                    <div class="video-error">⚠️ Video loading failed.</div>
                </div>
            `;
        }

        stage.classList.remove("show");

        setTimeout(() => {
            stage.innerHTML = `
                <div class="pro-dashboard">

                    <aside class="side-panel">
                        <div class="side-logo">🩺</div>
                        <h3>${safeText(data.disease)} Modules</h3>

                        <div class="module-list">
                            <button class="module-item active" onclick="showModule(this, 'Overview', '${cleanTextForAttr(data.visual_story)}', '📌')">Overview</button>
                            <button class="module-item" onclick="showModule(this, 'Cause', '${cleanTextForAttr(data.cause)}', '🦠')">Cause</button>
                            <button class="module-item" onclick="showModule(this, 'Body Effect', '${cleanTextForAttr(data.body_effect)}', '🩸')">Body Effect</button>
                            <button class="module-item" onclick="showModule(this, 'Symptoms', '${cleanTextForAttr(data.symptoms)}', '🤒')">Symptoms</button>
                            <button class="module-item" onclick="showModule(this, 'Diagnosis', '${cleanTextForAttr(data.diagnosis)}', '🩺')">Diagnosis</button>
                            <button class="module-item" onclick="showModule(this, 'Treatment', '${cleanTextForAttr(data.treatment)}', '💊')">Treatment</button>
                            <button class="module-item" onclick="showModule(this, 'Prevention', '${cleanTextForAttr(data.prevention)}', '🛡️')">Prevention</button>
                        </div>

                        <div class="side-stat">
                            <b>6</b>
                            <span>learning sections generated by AI</span>
                        </div>
                    </aside>

                    <main class="center-stack">
                        <section class="video-panel-card">
                            <div class="lesson-header">
                                <div>
                                    <h2>${safeText(data.disease)} Clinical Learning</h2>
                                    <p>Professional visual lesson with AI-generated medical summary.</p>
                                </div>
                                <div class="lesson-status">Ready</div>
                            </div>

                            ${videoHtml}
                        </section>

                        <section class="module-detail-card">
                            <div class="detail-top">
                                <div id="detailIcon" class="detail-icon">📌</div>
                                <h3 id="detailTitle">Overview</h3>
                            </div>
                            <p id="detailText">${safeText(data.visual_story)}</p>
                        </section>
                    </main>

                    <aside class="tutor-panel">
                        <div class="tutor-icon">🤖</div>
                        <h3>AI Tutor Summary</h3>
                        <p id="storyText">${safeText(data.visual_story)}</p>
                        <button class="speak-btn" onclick="speakLesson()">🔊 Listen Summary</button>
                    </aside>

                </div>
            `;

            stage.classList.add("show");
        }, 150);

    }catch(error){
        console.log(error);
        stage.innerHTML = `<div class="loading-box">❌ Server error. Try again.</div>`;
    }
}
</script>
